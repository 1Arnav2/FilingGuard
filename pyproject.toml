[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filingguard"
version = "0.1.0"
description = "Stress-test harness and hard-gated verifier for LLM finance research agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "google-genai>=1.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "python-dotenv>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: makes real API calls; run explicitly with `pytest -m live`",
]
