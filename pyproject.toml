[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "filingguard"
version = "0.1.0"
description = "Stress-test harness and hard-gated verifier for LLM finance research agents."
requires-python = ">=3.11,<3.12"
dependencies = [
    "google-genai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
    "live: makes real API calls; run explicitly with `pytest -m live`",
]
